name: Build and push Docker images

on:
  push:
    branches: [master]
  # weekly rebuild (Mondays 03:00 UTC) to pick up base-image and Debian security patches
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-prod:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: php8.3.Dockerfile
            tag: php8.3
          - dockerfile: php8.4.Dockerfile
            tag: php8.4
          - dockerfile: php8.5.Dockerfile
            tag: php8.5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: gusdecool/symfony:${{ matrix.tag }}
          cache-from: type=registry,ref=gusdecool/symfony:${{ matrix.tag }}
          cache-to: type=inline

  # dev images build FROM the published prod tag (see php8.x-dev.Dockerfile),
  # so they must run after build-prod has pushed the images they extend.
  build-dev:
    needs: build-prod
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: php8.3-dev.Dockerfile
            tag: php8.3-dev
          - dockerfile: php8.4-dev.Dockerfile
            tag: php8.4-dev
          - dockerfile: php8.5-dev.Dockerfile
            tag: php8.5-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: gusdecool/symfony:${{ matrix.tag }}
          cache-from: type=registry,ref=gusdecool/symfony:${{ matrix.tag }}
          cache-to: type=inline
